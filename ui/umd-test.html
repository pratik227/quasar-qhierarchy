<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QHierarchy UMD test</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/quasar@2.35.2/dist/quasar.prod.css" rel="stylesheet" type="text/css">
    <link href="dist/index.css" rel="stylesheet" type="text/css">
  </head>
  <body>
    <div id="q-app">
      <q-layout view="lHh Lpr fff">
        <q-header class="bg-grey-10">
          <q-toolbar>
            <q-toolbar-title>quasar-ui-qhierarchy v{{ version }}</q-toolbar-title>
            <div>Quasar v{{ $q.version }}</div>
          </q-toolbar>
        </q-header>
        <q-page-container>
          <q-page padding>
            <p class="text-grey-7">In /ui run <code>npm run build</code>, then refresh this page after each change. Use self-closing tags only.</p>
            <q-hierarchy :columns="columns" :data="data" selection="multiple" default-expand-all bordered flat></q-hierarchy>
          </q-page>
        </q-page-container>
      </q-layout>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@2.35.2/dist/quasar.umd.prod.js"></script>
    <script src="dist/index.umd.js"></script>

    <script>
      const app = Vue.createApp({
        setup () {
          return {
            version: qhierarchy.version,
            columns: [
              { name: 'label', label: 'Label', field: 'label', align: 'left', sortable: true },
              { name: 'note', label: 'Note', field: 'note', align: 'left' }
            ],
            data: [
              { label: 'Node 1', note: 'first', children: [{ label: 'Node 1.1', note: 'child' }, { label: 'Node 1.2', note: 'child' }] },
              { label: 'Node 2', note: 'second' }
            ]
          }
        }
      })

      app.use(Quasar)
      app.use(qhierarchy)
      app.mount('#q-app')
    </script>
  </body>
</html>
