# Netlify config for the QHierarchy docs (https://next-quasar-qhierarchy.netlify.app/)
# The docs app lives in /demo and builds the component from the local /ui and
# /app-extension sources, so the whole repo is needed (base only sets the cwd).

[build]
  base = "demo"
  command = "npm ci && npm run build"
  publish = "dist/spa"
  # skip deploys when nothing the docs depend on has changed (paths relative to base)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../ui ../app-extension ../netlify.toml"

[build.environment]
  # @quasar/app-vite v3 requires Node ^22.22 || ^24 || ^26 ...
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-audit --no-fund"

# SPA fallback for vue-router history mode
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# hashed build assets never change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
